# ==============================================================================
# Tesla Wall Connector Gen 3 - FW 26.x feedback control (experimental)
# ==============================================================================
# REQUIRED USER CONFIGURATION
# Set wallconn_ip to the local charger IP and preserve your own secrets.
# Auto/Manual: select "Current Only" for nonnegative import-only phase amps,
# or "Signed Power + Current" for a grid meter including EV and solar.
# Solar Surplus requires "Signed Power + Current": per-phase signed W
# (positive import / negative export), RMS A, and phase-neutral V.
# Verify meter direction and phase order before use. Never use kWh or totals.
# Configure every active phase selected by "Grid Phase Count".
# Manual Fixed and Unregulated do not require household/grid measurements.
# ==============================================================================

substitutions:
  device_name: tesla-wall-connector-control        # ESPHome device name (used for hostname and entity IDs)
  friendly_name: "Tesla Wall Connector Control"    # Friendly name shown in Home Assistant UI
  tx_pin: GPIO22                                   # RS485 TX pin on your ESP32 (connect to RS485 DI)
  rx_pin: GPIO21                                   # RS485 RX pin on your ESP32 (connect to RS485 RO)
  watchdog_fault_delay_ms: "8000"                  # Fault duration before latching recovery watchdog (missing data pauses immediately)
  watchdog_recover_delay_ms: "30000"               # Healthy-data recovery hold, with fallback current
  vitals_timeout_ms: "8000"                        # Maximum age of a successful complete vitals response
  house_sensor_timeout_ms: "0"                     # 0 = HA availability; enable only with real recurring samples
  wallconn_ip: "YOUR_WALL_CONNECTOR_IP"            # REQUIRED: replace with your local TWC IP (read-only /api/1/vitals)
  house_meter_reporting_entity: binary_sensor.tesla_house_current_reporting # Optional HA helper; see examples/

  # --- USER MUST SET THESE ---
  house_phase1_entity: sensor.your_phase1_current    # Phase 1 current sensor in Home Assistant (required for Auto/Manual)
  house_phase2_entity: sensor.your_phase2_current    # Phase 2 current sensor (ignored if 1-phase, do not remove)
  house_phase3_entity: sensor.your_phase3_current    # Phase 3 current sensor (ignored if 1- or 2-phase, do not remove)

  # Optional signed grid source; required for Solar Surplus.
  grid_phase1_power_entity: sensor.your_grid_phase1_real_power
  grid_phase2_power_entity: sensor.your_grid_phase2_real_power
  grid_phase3_power_entity: sensor.your_grid_phase3_real_power
  grid_phase1_voltage_entity: sensor.your_grid_phase1_voltage
  grid_phase2_voltage_entity: sensor.your_grid_phase2_voltage
  grid_phase3_voltage_entity: sensor.your_grid_phase3_voltage
  # house_phase1/2/3_entity above must be the SAME grid meter's RMS currents.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600.0
    then:
      # Apply restored conductor limit before the first main-loop Modbus reply.
      - script.execute: calc_registers
      # Power the RS485 hardware rails
      - switch.turn_on: sw_enable_5v_rs485
      - switch.turn_on: sw_enable_rs485
      - switch.turn_on: sw_rs485_auto_dir

      # Allow RS485 hardware to stabilize
      - delay: 500ms

      # Apply log level selected in Home Assistant
      - lambda: |-
          auto lvl_ref = id(ha_log_level).current_option();
          std::string lvl = lvl_ref.empty() ? "INFO" : std::string(lvl_ref.c_str());

          int level = ESPHOME_LOG_LEVEL_INFO;
          if (lvl == "ERROR") level = ESPHOME_LOG_LEVEL_ERROR;
          else if (lvl == "WARN") level = ESPHOME_LOG_LEVEL_WARN;
          else if (lvl == "INFO") level = ESPHOME_LOG_LEVEL_INFO;
          else if (lvl == "DEBUG") level = ESPHOME_LOG_LEVEL_DEBUG;

          id(main_logger).set_log_level(level);

      - delay: 2s
      - globals.set:
          id: boot_ready
          value: 'true'
      - script.execute: calc_registers

esp32:
  # ESP32 board definition
  board: esp32dev
  framework:
    type: esp-idf

logger:
  id: main_logger
  # Default log level (can be overridden from Home Assistant)
  level: DEBUG
  # Disable serial logging to free UART for RS485
  baud_rate: 0

api:
  id: ha_api
  reboot_timeout: 0s
  on_client_disconnected:
    - lambda: |-
        if (!id(ha_api).is_connected_with_state_subscription())
          twc_control::controller().invalidate_house();
    - script.execute: calc_registers
  encryption:
    # Use !secret api_key or replace with hardcoded string
    key: !secret api_key

ota:
  - platform: esphome
    # Require encrypted OTA using the same key as the native API.
    encryption:
      key: !secret api_key

wifi:
  reboot_timeout: 0s
  # Use !secret wifi_ssid and wifi_password or replace with hardcoded values
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback AP when WiFi cannot connect
  ap:
    ssid: "${friendly_name}"
    # Use !secret fallback_password or replace with hardcoded string
    password: !secret fallback_password

# Enables captive portal for fallback AP
captive_portal:

web_server:
  # Local web UI for diagnostics and debugging
  port: 80
  version: 3

external_components:
  - source:
      type: git
      url: https://github.com/Klangen82/tesla-wall-connector-control
      # Pinned component version; update together with this YAML.
      ref: 2eb9b857536e942ba48a39400a55d4739d6b3d63
    components: [twc_vitals]
    refresh: never

twc_vitals:
  id: wallconn_vitals
  url: "http://${wallconn_ip}/api/1/vitals"
  update_interval: 2s
  timeout: 2s

switch:
  # Enables 5V supply for RS485 board
  - platform: gpio
    id: sw_enable_5v_rs485
    name: "Hardware: RS485 5V"
    pin:
      number: GPIO16
      inverted: false
    restore_mode: ALWAYS_ON
    internal: true

  # Enables RS485 transceiver power
  - platform: gpio
    id: sw_enable_rs485
    name: "Hardware: RS485 Transceiver"
    pin:
      number: GPIO19
      inverted: false
    restore_mode: ALWAYS_ON
    internal: true

  # Enables RS485 automatic direction control
  - platform: gpio
    id: sw_rs485_auto_dir
    name: "Hardware: RS485 Auto Dir"
    pin:
      number: GPIO17
      inverted: false
    restore_mode: ALWAYS_ON
    internal: true

  # Enables or disables automatic status LED behavior
  - platform: template
    id: switch_auto_led_mode
    name: "Auto Status LED"
    icon: "mdi:eye-refresh"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  # Compatibility control for existing HA automations. The mode selector is
  # authoritative; OFF selects Manual, ON selects Auto. It cannot select bypass.
  - platform: template
    id: auto_load_control
    name: "Tesla Wall Connector Auto Mode"
    lambda: return id(control_mode).current_option() == "Auto";
    turn_on_action:
      - select.set:
          id: control_mode
          option: "Auto"
    turn_off_action:
      - select.set:
          id: control_mode
          option: "Manual"

  # Enables or disables watchdog safety logic
  - platform: template
    id: watchdog_enable
    name: "Tesla Watchdog Enable"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      - script.execute: calc_registers
    on_turn_off:
      - script.execute: calc_registers

  # Enable only after installing/verifying the HA reporting helper.
  - platform: template
    id: house_meter_guard
    name: "House Meter Reporting Guard"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: config
    on_turn_on:
      - script.execute: calc_registers
    on_turn_off:
      - script.execute: calc_registers

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Manual Control Status LED"
    # GPIO pin connected to the WS2812 LED
    pin: GPIO4
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812
    restore_mode: ALWAYS_OFF
    # Disable fade transitions
    default_transition_length: 0s
    # When LED is turned on manually, disable auto LED mode
    on_turn_on:
      - if:
          condition:
            lambda: return !id(led_is_internal_g);
          then:
            - switch.turn_off: switch_auto_led_mode
    # When LED is turned off manually, disable auto LED mode
    on_turn_off:
      - if:
          condition:
            lambda: return !id(led_is_internal_g);
          then:
            - switch.turn_off: switch_auto_led_mode

uart:
  - id: wallconn_uart
    # RS485 TX pin
    tx_pin: ${tx_pin}
    # RS485 RX pin
    rx_pin: ${rx_pin}
    # Baud rate used by Tesla Wall Connector protocol
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1

modbus:
  - id: wallconn_modbus
    # Bind Modbus to RS485 UART
    uart_id: wallconn_uart
    # Act as Modbus server (Tesla reads from this device)
    role: server

globals:
  - id: grid_received_ms
    type: std::array<uint32_t, 6>
    initial_value: '{0, 0, 0, 0, 0, 0}'
  # Flag to mark internal LED updates (prevents feedback loop)
  - id: led_is_internal_g
    type: bool
    initial_value: 'false'
  # Grid voltage used for power calculations
  - id: grid_voltage_v
    type: float
    initial_value: "230.0"
  # Simulated Phase 1 current sent to Tesla
  - id: ct1_current_a
    type: float
    initial_value: "201.25"
  # Simulated Phase 2 current sent to Tesla
  - id: ct2_current_a
    type: float
    initial_value: "201.25"
  # Simulated Phase 3 current sent to Tesla
  - id: ct3_current_a
    type: float
    initial_value: "201.25"
  # Total simulated current sent to Tesla
  - id: ct_total_a
    type: float
    initial_value: "603.75"
  # Simulated Phase 1 power sent to Tesla
  - id: ct1_power_w
    type: float
    initial_value: "46287.5"
  # Simulated Phase 2 power sent to Tesla
  - id: ct2_power_w
    type: float
    initial_value: "46287.5"
  # Simulated Phase 3 power sent to Tesla
  - id: ct3_power_w
    type: float
    initial_value: "46287.5"
  # Total simulated power sent to Tesla
  - id: ct_total_w
    type: float
    initial_value: "138862.5"

  # Timestamp of last Modbus poll from Tesla
  - id: modbus_last_poll_ms
    type: uint32_t
    initial_value: "0"
  # Effective software TARGET; actual current and emulated current are separate.
  - id: target_current_internal_a
    type: float
    initial_value: "0.0"
  - id: boot_ready
    type: bool
    initial_value: "false"
  - id: watchdog_active
    type: bool
    initial_value: "false"
  - id: watchdog_forced_pause
    type: bool
    initial_value: "true"
  - id: watchdog_reason
    type: std::string
    initial_value: '"Booting"'
  - id: control_status
    type: std::string
    initial_value: '"Boot / pause requested"'
  - id: current_headroom_a
    type: float
    initial_value: "NAN"
  - id: house_reporting_seen
    type: bool
    initial_value: 'false'
  - id: house_reporting_received_ms
    type: uint32_t
    initial_value: "0"

select:
  - platform: template
    id: control_mode
    name: "Tesla Control Mode"
    icon: "mdi:ev-station"
    options: ["Auto", "Manual", "Unregulated", "Manual Fixed", "Solar Surplus"]
    initial_option: "Auto"
    restore_value: true
    optimistic: true
    on_value:
      - script.execute: calc_registers

  - platform: template
    id: grid_measurement_source
    name: "Grid Measurement Source"
    options: ["Current Only", "Signed Power + Current"]
    initial_option: "Current Only"
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: calc_registers

  # Log level selector for ESPHome runtime logging
  - platform: template
    id: ha_log_level
    name: "ESPHome Log Level"
    icon: "mdi:console-line"
    options: ["ERROR", "WARN", "INFO", "DEBUG"]
    initial_option: "INFO"
    restore_value: true
    optimistic: true
    entity_category: "config"
    on_value:
      then:
        - lambda: |-
            int level = ESPHOME_LOG_LEVEL_INFO;
            if (x == "ERROR") level = ESPHOME_LOG_LEVEL_ERROR;
            else if (x == "WARN") level = ESPHOME_LOG_LEVEL_WARN;
            else if (x == "INFO") level = ESPHOME_LOG_LEVEL_INFO;
            else if (x == "DEBUG") level = ESPHOME_LOG_LEVEL_DEBUG;
            id(main_logger).set_log_level(level);

  # Grid voltage selector used for power calculations
  - platform: template
    id: grid_voltage_select
    name: "Grid Voltage"
    optimistic: true
    options: ["230V", "110V"]
    initial_option: "230V"
    restore_value: true
    entity_category: "config"
    on_value:
      then:
        - lambda: |-
            float v = (x == "110V") ? 110.0f : 230.0f;
            id(grid_voltage_v) = v;
            ESP_LOGI("tesla", "Grid voltage set to %.0fV", v);
        - script.execute: calc_registers

  # Number of grid phases used for load calculations
  - platform: template
    id: ha_phase_count
    name: "Grid Phase Count"
    icon: "mdi:sine-wave"
    options: ["1", "2", "3"]
    initial_option: "3"
    restore_value: true
    optimistic: true
    entity_category: "config"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("tesla", "Grid phase count changed to %s", x.c_str());
        - script.execute: calc_registers

number:
  # Main fuse rating of the house (used by Auto and load-balanced Manual)
  - platform: template
    id: ha_main_fuse
    name: "House Main Fuse"
    unit_of_measurement: "A"
    min_value: 6
    max_value: 200
    step: 1
    restore_value: true
    initial_value: 16
    optimistic: true
    entity_category: "config"
    on_value:
      then:
        - script.execute: calc_registers

  # Shared setpoint for Manual and Manual Fixed, retained independently of mode.
  - platform: template
    id: ha_set_current
    name: "Manual Target Setpoint"
    unit_of_measurement: "A"
    min_value: 0
    max_value: 48
    step: 1
    initial_value: 6
    restore_value: true
    optimistic: true
    on_value:
      - script.execute: calc_registers

  # Maximum current supported by the Wall Connector hardware
  - platform: template
    id: ha_wc_max_current
    name: "Wall Connector Max Current"
    unit_of_measurement: "A"
    min_value: 6
    max_value: 48
    step: 1
    restore_value: true
    initial_value: 32
    optimistic: true
    entity_category: "config"
    on_value:
      then:
        - script.execute: calc_registers

  # Watchdog fallback current used when safety triggers
  - platform: template
    id: watchdog_fallback_current
    name: "Tesla Watchdog Fallback Current"
    unit_of_measurement: "A"
    min_value: 6
    max_value: 48
    step: 1
    restore_value: true
    initial_value: 6
    optimistic: true
    entity_category: "config"
    on_value:
      - script.execute: calc_registers

  # Calibration reference: must match Tesla One, does not set it remotely.
  - platform: template
    id: ha_conductor_limit
    name: "TWC Meter Conductor Limit"
    unit_of_measurement: "A"
    min_value: 6
    max_value: 200
    step: 1
    initial_value: 16
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: calc_registers

  - platform: template
    id: ha_safety_margin
    name: "Tesla Safety Margin"
    unit_of_measurement: "A"
    min_value: 0
    max_value: 5
    step: 0.5
    initial_value: 1
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: calc_registers

  - platform: template
    id: ha_restart_margin
    name: "Tesla Restart Headroom Margin"
    unit_of_measurement: "A"
    min_value: 0
    max_value: 5
    step: 0.5
    initial_value: 1
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: calc_registers

  - platform: template
    id: ha_restart_delay
    name: "Tesla Restart Stable Time"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 300
    step: 5
    initial_value: 30
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: calc_registers

  - platform: template
    id: solar_deficit_delay
    name: "Solar Deficit Grace Time"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 300
    step: 5
    initial_value: 60
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: calc_registers

  - platform: template
    id: solar_start_delay
    name: "Solar Start Stable Time"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 300
    step: 5
    initial_value: 30
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: calc_registers


button:
  # Restart ESP device from Home Assistant
  - platform: restart
    name: "${friendly_name} Restart"

sensor:
  # A changing HA helper attribute proves the helper is still evaluating.
  # This is separate from whether the actual meter's reports are fresh.
  - platform: homeassistant
    id: ha_meter_check_timestamp
    entity_id: ${house_meter_reporting_entity}
    attribute: checked_at_ts
    on_value:
      - lambda: |-
          id(house_reporting_seen) = std::isfinite(x) && x > 0;
          id(house_reporting_received_ms) = millis();
      - script.execute: calc_registers

  # Device uptime
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"

  # WiFi signal strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  # Effective requested target; no -0.01 A rounding workaround on FW 26.x.
  - platform: template
    name: "Tesla Wall Connector Effective Setpoint"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      return id(target_current_internal_a);

  # Phase 1 house load (from Home Assistant sensor)
  - platform: template
    name: "House Load Phase 1"
    update_interval: 2s
    unit_of_measurement: "A"
    accuracy_decimals: 2
    lambda: |-
      return id(ha_house_l1).state;

  # Phase 2 house load (from Home Assistant sensor)
  - platform: template
    name: "House Load Phase 2"
    update_interval: 2s
    unit_of_measurement: "A"
    accuracy_decimals: 2
    lambda: |-
      return id(ha_house_l2).state;

  # Phase 3 house load (from Home Assistant sensor)
  - platform: template
    name: "House Load Phase 3"
    update_interval: 2s
    unit_of_measurement: "A"
    accuracy_decimals: 2
    lambda: |-
      return id(ha_house_l3).state;

  # Home Assistant Phase 1 sensor (used by Auto mode and Watchdog)
  - platform: homeassistant
    id: ha_house_l1
    entity_id: ${house_phase1_entity}
    on_value:
      then:
        - lambda: |-
            twc_control::controller().house[0].update(x, millis(), ${house_sensor_timeout_ms} > 0);
            id(calc_registers).execute();

  # Home Assistant Phase 2 sensor
  - platform: homeassistant
    id: ha_house_l2
    entity_id: ${house_phase2_entity}
    on_value:
      then:
        - lambda: |-
            twc_control::controller().house[1].update(x, millis(), ${house_sensor_timeout_ms} > 0);
            id(calc_registers).execute();

  # Home Assistant Phase 3 sensor
  - platform: homeassistant
    id: ha_house_l3
    entity_id: ${house_phase3_entity}
    on_value:
      then:
        - lambda: |-
            twc_control::controller().house[2].update(x, millis(), ${house_sensor_timeout_ms} > 0);
            id(calc_registers).execute();

  - platform: homeassistant
    id: ha_grid_power_1
    entity_id: ${grid_phase1_power_entity}
    on_value:
      - lambda: id(grid_received_ms)[0] = millis();
      - script.execute: calc_registers

  - platform: homeassistant
    id: ha_grid_voltage_1
    entity_id: ${grid_phase1_voltage_entity}
    on_value:
      - lambda: id(grid_received_ms)[1] = millis();
      - script.execute: calc_registers

  - platform: template
    name: "Tesla Actual Phase 1 Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      return id(wallconn_vitals).fresh(${vitals_timeout_ms}) ? id(wallconn_vitals).sample().phase[0] : NAN;

  - platform: homeassistant
    id: ha_grid_power_2
    entity_id: ${grid_phase2_power_entity}
    on_value:
      - lambda: id(grid_received_ms)[2] = millis();
      - script.execute: calc_registers

  - platform: homeassistant
    id: ha_grid_voltage_2
    entity_id: ${grid_phase2_voltage_entity}
    on_value:
      - lambda: id(grid_received_ms)[3] = millis();
      - script.execute: calc_registers

  - platform: template
    name: "Tesla Actual Phase 2 Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      return id(wallconn_vitals).fresh(${vitals_timeout_ms}) ? id(wallconn_vitals).sample().phase[1] : NAN;

  - platform: homeassistant
    id: ha_grid_power_3
    entity_id: ${grid_phase3_power_entity}
    on_value:
      - lambda: id(grid_received_ms)[4] = millis();
      - script.execute: calc_registers

  - platform: homeassistant
    id: ha_grid_voltage_3
    entity_id: ${grid_phase3_voltage_entity}
    on_value:
      - lambda: id(grid_received_ms)[5] = millis();
      - script.execute: calc_registers

  - platform: template
    name: "Tesla Actual Phase 3 Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      return id(wallconn_vitals).fresh(${vitals_timeout_ms}) ? id(wallconn_vitals).sample().phase[2] : NAN;

  # Exposes Wall Connector max current as sensor for UI visibility
  - platform: template
    name: "Effective Max Charge Current"
    unit_of_measurement: "A"
    accuracy_decimals: 0
    lambda: |-
      return id(ha_wc_max_current).state;
    update_interval: 5s

  - platform: template
    name: "Tesla Actual Charge Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      return id(wallconn_vitals).fresh(${vitals_timeout_ms}) ? id(wallconn_vitals).sample().vehicle : NAN;

  - platform: template
    name: "Tesla Available Charge Headroom"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: return id(current_headroom_a);

  - platform: template
    name: "Neurio Emulated Phase A Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: return id(ct1_current_a);

  - platform: template
    name: "Neurio Emulated Phase B Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: return id(ct2_current_a);

  - platform: template
    name: "Neurio Emulated Phase C Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: return id(ct3_current_a);

  - platform: template
    name: "Tesla Feedback Response Time"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 2s
    lambda: return id(wallconn_vitals).response_time_ms();

  - platform: template
    name: "Tesla Feedback Last Success Age"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 2s
    lambda: return id(wallconn_vitals).last_success_age_s();

  - platform: template
    name: "Tesla Feedback Failed Polls"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 2s
    lambda: return id(wallconn_vitals).failure_count();

  - platform: template
    name: "Tesla Feedback Consecutive Failures"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 2s
    lambda: return id(wallconn_vitals).consecutive_failures();

  - platform: template
    name: "Tesla Feedback HTTP Status"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 2s
    lambda: return id(wallconn_vitals).http_status();

  - platform: template
    name: "Tesla RS485 Last Poll Age"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      return id(modbus_last_poll_ms) == 0 ? NAN : float(uint32_t(millis() - id(modbus_last_poll_ms))) / 1000.0f;

  - platform: template
    name: "House Phase 1 Received Value Age"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      const auto &p = twc_control::controller().house[0];
      return p.valid ? float(uint32_t(millis() - p.updated_ms)) / 1000.0f : NAN;

  - platform: template
    name: "House Phase 2 Received Value Age"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      const auto &p = twc_control::controller().house[1];
      return p.valid ? float(uint32_t(millis() - p.updated_ms)) / 1000.0f : NAN;

  - platform: template
    name: "House Phase 3 Received Value Age"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      const auto &p = twc_control::controller().house[2];
      return p.valid ? float(uint32_t(millis() - p.updated_ms)) / 1000.0f : NAN;

binary_sensor:
  - platform: template
    name: "Tesla Contactor Closed"
    entity_category: diagnostic
    lambda: |-
      return id(wallconn_vitals).fresh(${vitals_timeout_ms}) && id(wallconn_vitals).sample().contactor;

  - platform: template
    name: "Tesla Feedback Healthy"
    lambda: return id(wallconn_vitals).fresh(${vitals_timeout_ms});

  - platform: template
    name: "Tesla RS485 Polling Active"
    entity_category: diagnostic
    lambda: return id(modbus_last_poll_ms) != 0 && uint32_t(millis() - id(modbus_last_poll_ms)) < 10000;

text_sensor:
  - platform: template
    name: "Tesla Feedback Last Failure"
    entity_category: diagnostic
    update_interval: 1s
    lambda: return std::string(id(wallconn_vitals).last_failure_status());

  - platform: homeassistant
    id: ha_meter_reporting
    entity_id: ${house_meter_reporting_entity}
    on_value:
      - script.execute: calc_registers

  - platform: template
    name: "Tesla Feedback Request Status"
    entity_category: diagnostic
    update_interval: 1s
    lambda: return std::string(id(wallconn_vitals).request_status());

  - platform: template
    name: "Tesla RS485 Status"
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      if (id(modbus_last_poll_ms) == 0) return std::string("No measurement polls received since boot");
      if (uint32_t(millis() - id(modbus_last_poll_ms)) >= 10000)
        return std::string("Measurement polling lost; control reception unconfirmed");
      return std::string("Measurement polls received; meter acceptance unconfirmed");

  - platform: template
    name: "Tesla Auto Status"
    lambda: return id(control_status);
    update_interval: 1s

  - platform: template
    name: "Tesla House Load Sensor Status"
    lambda: |-
      if (id(control_mode).current_option() == "Manual Fixed")
        return std::string("Not used in Manual Fixed; house load balancing bypassed");
      int phases = atoi(id(ha_phase_count).current_option().c_str());
      if (!id(ha_api).is_connected_with_state_subscription())
        return std::string("HA disconnected");
      if (id(grid_measurement_source).current_option() != "Signed Power + Current"
          && !twc_control::controller().house_available(phases, millis(), ${house_sensor_timeout_ms}))
        return std::string("Required house sensor missing, invalid or stale");
      if (id(house_meter_guard).state) {
        if (id(ha_meter_reporting).state != "on" || !id(house_reporting_seen)
            || uint32_t(millis() - id(house_reporting_received_ms)) >= 15000)
          return std::string("House meter reporting missing or stale");
        return std::string("House sensors available; reporting guard healthy");
      }
      if (id(grid_measurement_source).current_option() == "Signed Power + Current")
        return std::string("Signed grid source selected; inspect control/watchdog status for validity");
      return std::string("House sensors available; source reporting guard OFF");
    update_interval: 2s

  - platform: template
    id: watchdog_status
    name: "Tesla Watchdog Status"
    lambda: |-
      if (id(control_mode).current_option() == "Unregulated")
        return std::string("Bypassed (Unregulated)");
      if (id(control_status).find("Waiting for stable") != std::string::npos)
        return std::string("Pause requested: waiting for stable restart headroom");
      if (id(watchdog_forced_pause))
        return std::string("Pause requested: ") + id(watchdog_reason);
      if (!id(watchdog_enable).state)
        return std::string("Recovery watchdog disabled; data guards active");
      if (id(watchdog_active))
        return id(control_mode).current_option() == "Manual Fixed"
            ? std::string("Recovery: fallback current, limited by manual target and max current")
            : std::string("Recovery: fallback current, limited by headroom");
      return std::string("OK");
    update_interval: 1s

script:
  - id: calc_registers
    then:
      - lambda: |-
          twc_control::Settings settings;
          settings.signed_grid = id(grid_measurement_source).current_option() == "Signed Power + Current";
          settings.solar_deficit_ms = std::isfinite(id(solar_deficit_delay).state)
              ? uint32_t(id(solar_deficit_delay).state * 1000.0f) : 60000u;
          settings.solar_start_ms = std::isfinite(id(solar_start_delay).state)
              ? uint32_t(id(solar_start_delay).state * 1000.0f) : 30000u;
          settings.main_fuse = id(ha_main_fuse).state;
          settings.conductor = id(ha_conductor_limit).state;
          settings.max_charge = id(ha_wc_max_current).state;
          settings.manual_target = id(ha_set_current).state;
          settings.margin = id(ha_safety_margin).state;
          settings.fallback = id(watchdog_fallback_current).state;
          settings.watchdog = id(watchdog_enable).state;
          settings.fault_delay_ms = ${watchdog_fault_delay_ms};
          settings.recovery_ms = ${watchdog_recover_delay_ms};
          settings.house_timeout_ms = ${house_sensor_timeout_ms};
          settings.resume_margin = id(ha_restart_margin).state;
          settings.resume_delay_ms = std::isfinite(id(ha_restart_delay).state)
              ? uint32_t(id(ha_restart_delay).state * 1000.0f) : 30000u;
          settings.meter_guard = id(house_meter_guard).state;
          twc_control::Input input;
          auto mode = id(control_mode).current_option();
          input.mode = mode == "Unregulated" ? twc_control::Mode::UNREGULATED
              : mode == "Manual Fixed" ? twc_control::Mode::MANUAL_FIXED
              : mode == "Solar Surplus" ? twc_control::Mode::SOLAR
              : mode == "Manual" ? twc_control::Mode::MANUAL : twc_control::Mode::AUTO;
          auto phase_option = id(ha_phase_count).current_option();
          input.phases = phase_option.empty() ? 3 : atoi(phase_option.c_str());
          input.ready = id(boot_ready);
          input.now = millis();
          input.ha_connected = id(ha_api).is_connected_with_state_subscription();
          input.feedback_fresh = id(wallconn_vitals).fresh(${vitals_timeout_ms});
          input.meter_reporting = id(ha_meter_reporting).state == "on" && id(house_reporting_seen)
              && uint32_t(millis() - id(house_reporting_received_ms)) < 15000;
          const auto &vitals = id(wallconn_vitals).sample();
          input.contactor = vitals.contactor;
          input.vehicle = vitals.vehicle;
          for (int i = 0; i < 3; ++i) input.ev[i] = vitals.phase[i];
          input.grid_power[0] = id(ha_grid_power_1).state;
          input.grid_power[1] = id(ha_grid_power_2).state;
          input.grid_power[2] = id(ha_grid_power_3).state;
          input.grid_voltage[0] = id(ha_grid_voltage_1).state;
          input.grid_voltage[1] = id(ha_grid_voltage_2).state;
          input.grid_voltage[2] = id(ha_grid_voltage_3).state;
          input.grid_current[0] = id(ha_house_l1).state;
          input.grid_current[1] = id(ha_house_l2).state;
          input.grid_current[2] = id(ha_house_l3).state;
          if (settings.signed_grid && settings.house_timeout_ms > 0) {
            input.grid_fresh = twc_control::controller().house_available(input.phases, input.now, settings.house_timeout_ms);
            for (int i = 0; i < input.phases * 2; ++i)
              input.grid_fresh = input.grid_fresh && uint32_t(input.now - id(grid_received_ms)[i]) < settings.house_timeout_ms;
          }
          const auto result = twc_control::controller().tick(settings, input);
          id(target_current_internal_a) = result.target;
          id(current_headroom_a) = result.headroom;
          id(watchdog_active) = result.watchdog_active;
          id(watchdog_forced_pause) = result.zone == twc_control::Zone::PAUSE
              || result.zone == twc_control::Zone::BOOT || result.zone == twc_control::Zone::RESTART_WAIT;
          id(watchdog_reason) = result.fault != twc_control::Fault::NONE
              ? twc_control::fault_name(result.fault) : "Below minimum charge current";
          id(control_status) = std::string(mode.empty() ? "Auto" : mode.c_str()) + " / " + twc_control::zone_name(result.zone)
              + (result.solar_grace ? " / Solar deficit grace (grid import allowed)" : "");
          id(ct1_current_a) = result.reported[0];
          id(ct2_current_a) = result.reported[1];
          id(ct3_current_a) = result.reported[2];
          id(ct_total_a) = id(ct1_current_a) + id(ct2_current_a) + id(ct3_current_a);
          id(ct1_power_w) = id(grid_voltage_v) * id(ct1_current_a);
          id(ct2_power_w) = id(grid_voltage_v) * id(ct2_current_a);
          id(ct3_power_w) = id(grid_voltage_v) * id(ct3_current_a);
          id(ct_total_w) = id(ct1_power_w) + id(ct2_power_w) + id(ct3_power_w);

modbus_server:
  # Modbus server emulating Tesla Neurio energy meter
  - id: wc_mb_server
    modbus_id: wallconn_modbus
    address: 1

    # Respond to any unknown register reads to avoid Wall Connector errors
    courtesy_response:
      enabled: true
      register_last_address: 0xFFFF
      register_value: 0

    registers:
      # Identity block required by Tesla Wall Connector (static values)
      - { address: 1, value_type: U_WORD, read_lambda: 'return 0x3078;' }
      - { address: 2, value_type: U_WORD, read_lambda: 'return 0x3030;' }
      - { address: 3, value_type: U_WORD, read_lambda: 'return 0x3030;' }
      - { address: 4, value_type: U_WORD, read_lambda: 'return 0x3034;' }
      - { address: 5, value_type: U_WORD, read_lambda: 'return 0x3731;' }
      - { address: 6, value_type: U_WORD, read_lambda: 'return 0x3442;' }
      - { address: 7, value_type: U_WORD, read_lambda: 'return 0x3035;' }
      - { address: 8, value_type: U_WORD, read_lambda: 'return 0x3638;' }
      - { address: 9, value_type: U_WORD, read_lambda: 'return 0x3631;' }
      - { address: 10, value_type: U_WORD, read_lambda: 'return 0x0000;' }
      - { address: 11, value_type: U_WORD, read_lambda: 'return 0x312E;' }
      - { address: 12, value_type: U_WORD, read_lambda: 'return 0x362E;' }
      - { address: 13, value_type: U_WORD, read_lambda: 'return 0x312D;' }
      - { address: 14, value_type: U_WORD, read_lambda: 'return 0x5465;' }
      - { address: 15, value_type: U_WORD, read_lambda: 'return 0x736C;' }
      - { address: 16, value_type: U_WORD, read_lambda: 'return 0x6100;' }
      - { address: 17, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 18, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 19, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 20, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 21, value_type: U_WORD, read_lambda: 'return 0x3031;' }
      - { address: 22, value_type: U_WORD, read_lambda: 'return 0x322E;' }
      - { address: 23, value_type: U_WORD, read_lambda: 'return 0x3030;' }
      - { address: 24, value_type: U_WORD, read_lambda: 'return 0x3032;' }
      - { address: 25, value_type: U_WORD, read_lambda: 'return 0x3041;' }
      - { address: 26, value_type: U_WORD, read_lambda: 'return 0x2E48;' }
      - { address: 27, value_type: U_WORD, read_lambda: 'return 0x0000;' }
      - { address: 28, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 29, value_type: U_WORD, read_lambda: 'return 0x3930;' }
      - { address: 30, value_type: U_WORD, read_lambda: 'return 0x3935;' }
      - { address: 31, value_type: U_WORD, read_lambda: 'return 0x3400;' }
      - { address: 32, value_type: U_WORD, read_lambda: 'return 0x5641;' }
      - { address: 33, value_type: U_WORD, read_lambda: 'return 0x4834;' }
      - { address: 34, value_type: U_WORD, read_lambda: 'return 0x3831;' }
      - { address: 35, value_type: U_WORD, read_lambda: 'return 0x3041;' }
      - { address: 36, value_type: U_WORD, read_lambda: 'return 0x4230;' }
      - { address: 37, value_type: U_WORD, read_lambda: 'return 0x3233;' }
      - { address: 38, value_type: U_WORD, read_lambda: 'return 0x3100;' }
      - { address: 39, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 40, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 41, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 42, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 43, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 44, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 45, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 46, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 47, value_type: U_WORD, read_lambda: 'return 0x3034;' }
      - { address: 48, value_type: U_WORD, read_lambda: 'return 0x3A37;' }
      - { address: 49, value_type: U_WORD, read_lambda: 'return 0x313A;' }
      - { address: 50, value_type: U_WORD, read_lambda: 'return 0x3442;' }
      - { address: 51, value_type: U_WORD, read_lambda: 'return 0x3A30;' }
      - { address: 52, value_type: U_WORD, read_lambda: 'return 0x353A;' }
      - { address: 53, value_type: U_WORD, read_lambda: 'return 0x3638;' }
      - { address: 54, value_type: U_WORD, read_lambda: 'return 0x3A36;' }
      - { address: 55, value_type: U_WORD, read_lambda: 'return 0x3100;' }

      # Secondary identity block required by Wall Connector handshake
      - { address: 40002, value_type: U_WORD, read_lambda: 'return 0x0001;' }
      - { address: 40003, value_type: U_WORD, read_lambda: 'return 0x0042;' }
      - { address: 40004, value_type: U_WORD, read_lambda: 'return 0x4765;' }
      - { address: 40005, value_type: U_WORD, read_lambda: 'return 0x6E65;' }
      - { address: 40006, value_type: U_WORD, read_lambda: 'return 0x7261;' }
      - { address: 40007, value_type: U_WORD, read_lambda: 'return 0x6300;' }

      # Power measurement per phase and total (simulated Neurio)
      - address: 0x88
        value_type: FP32
        read_lambda: |-
          if (id(modbus_last_poll_ms) == 0) {
            ESP_LOGI("modbus", "Wall Connector started polling Modbus");
          }
          id(modbus_last_poll_ms) = millis();
          return id(ct1_power_w);

      - address: 0x8A
        value_type: FP32
        read_lambda: return id(ct2_power_w);

      - address: 0x8C
        value_type: FP32
        read_lambda: return id(ct3_power_w);

      - address: 0x8E
        value_type: FP32
        read_lambda: return 0.0f;

      - address: 0x90
        value_type: FP32
        read_lambda: return id(ct_total_w);

      # Voltage per phase
      - address: 0x94
        value_type: FP32
        read_lambda: return id(grid_voltage_v);

      - address: 0x96
        value_type: FP32
        read_lambda: return id(grid_voltage_v);

      - address: 0x98
        value_type: FP32
        read_lambda: return id(grid_voltage_v);

      # Grid frequency
      - address: 0x9A
        value_type: FP32
        read_lambda: return 50.0;

      # Current per phase and total
      - address: 0xF4
        value_type: FP32
        read_lambda: |-
          id(modbus_last_poll_ms) = millis();
          return id(ct1_current_a);

      - address: 0xF6
        value_type: FP32
        read_lambda: return id(ct2_current_a);

      - address: 0xF8
        value_type: FP32
        read_lambda: return id(ct3_current_a);

      - address: 0xFA
        value_type: FP32
        read_lambda: return 0.0f;

      - address: 0xFC
        value_type: FP32
        read_lambda: return id(ct_total_a);

interval:
  # Recompute every second, including on feedback expiry / unchanged HA data.
  - interval: 1s
    then:
      - script.execute: calc_registers

  # Status LED handling and Modbus activity indicator
  - interval: 5s
    then:
      - globals.set:
          id: led_is_internal_g
          value: 'true'

      - if:
          condition:
            lambda: return id(switch_auto_led_mode).state && (id(watchdog_active) || id(watchdog_forced_pause));
          then:
            # Blue blink = watchdog active
            - light.turn_on:
                id: status_led
                red: 0%
                green: 0%
                blue: 100%
                brightness: 80%
            - delay: 200ms
            - light.turn_off: status_led

          else:
            - if:
                condition:
                  lambda: return id(switch_auto_led_mode).state;
                then:
                  - if:
                      condition:
                        lambda: return id(modbus_last_poll_ms) != 0 && (millis() - id(modbus_last_poll_ms)) < 3000;
                      then:
                        # Green blink = Wall Connector polling OK
                        - light.turn_on:
                            id: status_led
                            red: 0%
                            green: 100%
                            blue: 0%
                            brightness: 100%
                        - delay: 120ms
                        - light.turn_on:
                            id: status_led
                            red: 0%
                            green: 10%
                            blue: 0%
                            brightness: 20%
                      else:
                        - if:
                            condition:
                              lambda: return (millis() - id(modbus_last_poll_ms)) > 10000;
                            then:
                              - lambda: |-
                                  ESP_LOGD("modbus", "Wall Connector not polling Modbus for >10s");
                              # Red = Wall Connector not polling
                              - light.turn_on:
                                  id: status_led
                                  red: 100%
                                  green: 0%
                                  blue: 0%
                                  brightness: 60%

      - globals.set:
          id: led_is_internal_g
          value: 'false'
